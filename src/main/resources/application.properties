spring.application.name=tablesignal
server.address=${TABLESIGNAL_BIND_ADDRESS:127.0.0.1}
server.port=${TABLESIGNAL_PORT:8080}
spring.datasource.url=${TABLESIGNAL_DB_URL:jdbc:postgresql://localhost:5432/tablesignal}
spring.datasource.username=${TABLESIGNAL_DB_USER:tablesignal}
spring.datasource.password=${TABLESIGNAL_DB_PASSWORD:local-demo-only}
spring.flyway.enabled=true

spring.jackson.time-zone=UTC
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.parser.strict-duplicate-detection=true

# Revalidate local UI assets after replacing the application JAR.
spring.web.resources.cache.cachecontrol.no-cache=true
